[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./" }]
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
    "contracts/=contracts/"
]

[profile.default.model_checker]
contracts = { "contracts/EVMInvariantShield.sol" = ["EVMInvariantShield"] }
engine = "chc"
timeout = 10000
targets = ["assert"]
